<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16224a"/>
      <stop offset="60%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#070a18"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg4)"/>
  <!-- dotted mala ring frames the syllable -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#7fe3c4" stroke-width="6" stroke-dasharray="2 20" stroke-linecap="round" opacity="0.7"/>
  <!-- guru bead -->
  <circle cx="256" cy="88" r="16" fill="#e8c887"/>
  <!-- Devanagari "naam" syllable -->
  <text x="256" y="320" text-anchor="middle" font-family="'Noto Serif Devanagari', Georgia, serif" font-size="190" fill="#f5f4ef">नाम</text>
</svg>
