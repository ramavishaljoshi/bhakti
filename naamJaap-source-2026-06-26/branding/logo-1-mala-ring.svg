<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16224a"/>
      <stop offset="60%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#070a18"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa7ff"/>
      <stop offset="100%" stop-color="#7fe3c4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>
  <!-- mala of 36 beads -->
  <g fill="none" stroke="url(#ring1)" stroke-width="9" stroke-linecap="round" stroke-dasharray="3 22" opacity="0.95">
    <circle cx="256" cy="256" r="150"/>
  </g>
  <!-- sumeru (guru) bead top -->
  <circle cx="256" cy="106" r="22" fill="#e8c887"/>
  <circle cx="256" cy="106" r="22" fill="none" stroke="#fff3d6" stroke-width="2" opacity="0.6"/>
  <!-- center 108 -->
  <text x="256" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" fill="#f5f4ef">108</text>
